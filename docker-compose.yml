version: '3.8'

services:
  uniride-booking-db:
    image: postgres:15
    container_name: uniride-booking-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uniride_bookings
    ports:
      - "5435:5432"
    volumes:
      - booking_data:/var/lib/postgresql/data

volumes:
  booking_data: